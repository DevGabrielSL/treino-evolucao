name: Strava prototype (offline tests)
on:
  push:
    branches: [feature/strava-auto-publish-test]
    paths:
      - 'testing/strava/**'
      - '.github/workflows/strava-prototype-tests.yml'
  pull_request:
    paths:
      - 'testing/strava/**'
      - '.github/workflows/strava-prototype-tests.yml'
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node testing/strava/strava_publisher_tests.mjs
