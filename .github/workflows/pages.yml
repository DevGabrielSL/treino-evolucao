name: Publicar Treino & Evolução
on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'patches/**'
      - 'tests/**'
      - 'release-staging/**'
      - 'integration/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código público
        uses: actions/checkout@v4
      - name: Restaurar a distribuição e validar integridade
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part01.b64 payload/part02.b64 payload/part03a.b64 payload/part03b.b64 payload/part04.b64 payload/part05.b64 payload/part06.b64 payload/part07.b64 | base64 --decode > /tmp/public-site.tar.xz
          echo "2a8836fc6cb58e9485d555149e3557cf676be3353630445f44052c32db444aee  /tmp/public-site.tar.xz" | sha256sum --check
          mkdir -p dist
          tar -xJf /tmp/public-site.tar.xz -C dist
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' | grep -q .
      - name: Aplicar atualização de edição e repetição de treinos (v0.4)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, lzma, json, hashlib
          from pathlib import Path
          raw=base64.b64decode(Path('patches/v04-update.xz.b64').read_text().strip(),validate=True)
          expected='11102740f955ab3964bb92e7860ba6891c5e259b1bfaf48f88190c37cc5de583'
          assert hashlib.sha256(raw).hexdigest()==expected, 'SHA-256 do pacote v0.4 diferente do esperado'
          delta=json.loads(lzma.decompress(raw))
          for name in ('app.js','sw.js','index.html'):
              entry=delta[name]; path=Path('dist')/name
              original=path.read_text(encoding='utf-8')
              assert hashlib.sha256(original.encode()).hexdigest()==entry['sha'], 'Versão base incompatível: '+name
              new=original
              for start,end,text in reversed(entry['ops']):
                  new=new[:start]+text+new[end:]
              path.write_text(new,encoding='utf-8')
          (Path('dist')/'edit_ops.js').write_text(delta['edit_ops.js'],encoding='utf-8')
          assert "shell-v4" in Path('dist/sw.js').read_text()
          assert "edit_ops.js" in Path('dist/sw.js').read_text()
          print('Upgrade v0.4 aplicado e conferido sem dados pessoais')
          PY
          node --check dist/app.js
          node --check dist/edit_ops.js
          test -f dist/icons/icon-192.png
          test -f dist/manifest.webmanifest
          ! find dist -iname '*historico*' -o -iname '*privado*' | grep -q .
      - name: Atualizar o app público para v0.5 e verificar integridade
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode patches/v05-public-site.tar.xz.b64 > /tmp/v05-public.tar.xz
          echo "9ff980ee805b230c2a62a88d8c7a06cf8f41a467dd8a4fe1235a724470c8f9ca  /tmp/v05-public.tar.xz" | sha256sum --check
          tar -xJf /tmp/v05-public.tar.xz -C dist
          test -f dist/template_ops.js
          grep -q "shell-v5" dist/sw.js
          grep -q "template_ops.js" dist/sw.js
          grep -q "Modelos" dist/index.html
          node --check dist/template_ops.js
          node --check dist/app.js
          node --check dist/store.js
          node --check dist/metrics.js
          node --check dist/backup.js
          node --check dist/edit_ops.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Aplicar correções auditadas v0.5.1 e executar regressões
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/v051_apply.py dist
          mkdir -p dist/tests
          cp tests/v051_regression.mjs dist/tests/regression.mjs
          node --experimental-default-type=module dist/tests/regression.mjs
          rm -rf dist/tests
          node --check dist/app.js
          node --check dist/store.js
          node --check dist/metrics.js
          node --check dist/edit_ops.js
          node --check dist/template_ops.js
          node --check dist/backup.js
          grep -q 'shell-v051' dist/sw.js
          grep -q 'v0.5.1' dist/index.html
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Atualizar análises v0.6 e testar evolução
        shell: bash
        run: |
          set -euo pipefail
          cat release-staging/v06/part01.b64 release-staging/v06/part02.b64 release-staging/v06/part03.b64 | base64 --decode > /tmp/treino-v06-upgrade.tar.xz
          echo "0b689ecd150057b4b1eb5efe8a9637ab7ac39099904f5268f083553ef4ec211c  /tmp/treino-v06-upgrade.tar.xz" | sha256sum --check
          mkdir -p /tmp/treino-v06-upgrade
          tar -xJf /tmp/treino-v06-upgrade.tar.xz -C /tmp/treino-v06-upgrade
          python3 /tmp/treino-v06-upgrade/apply_v06.py dist /tmp/treino-v06-upgrade
          mkdir -p dist/tests
          sed 's@../public/@../@g' /tmp/treino-v06-upgrade/tests/insights_v06.mjs > dist/tests/insights_v06.mjs
          node --experimental-default-type=module dist/tests/insights_v06.mjs | tee /tmp/treino-v06-tests.log
          grep -qx 'TOTAL_INSIGHTS_TESTS=35' /tmp/treino-v06-tests.log
          rm -rf dist/tests
          node --check dist/app.js
          node --check dist/insights.js
          node --check dist/sw.js
          grep -q 'shell-v06' dist/sw.js
          grep -q 'v0.6' dist/index.html
          grep -q "'./insights.js'" dist/sw.js
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Atualizar histórico consultável v0.7 e executar 55 regressões
        shell: bash
        run: |
          set -euo pipefail
          cat release-staging/v07/part01.b64 release-staging/v07/part02.b64 release-staging/v07/part03.b64 release-staging/v07/part04.b64 | base64 --decode > /tmp/treino-v07-upgrade.tar.xz
          echo "139e48d01b95f1518d5c69a3a791428d427d231fd419cb1cf83e4089348ad03f  /tmp/treino-v07-upgrade.tar.xz" | sha256sum --check
          mkdir -p /tmp/treino-v07-upgrade
          tar -xJf /tmp/treino-v07-upgrade.tar.xz -C /tmp/treino-v07-upgrade
          python3 /tmp/treino-v07-upgrade/apply_v07.py dist /tmp/treino-v07-upgrade
          mkdir -p dist/tests
          sed 's@../public/@../@g' /tmp/treino-v07-upgrade/history_v07.mjs > dist/tests/history_v07.mjs
          node --experimental-default-type=module dist/tests/history_v07.mjs | tee /tmp/treino-v07-tests.log
          grep -qx 'TOTAL_HISTORY_TESTS=55' /tmp/treino-v07-tests.log
          rm -rf dist/tests
          node --check dist/app.js
          node --check dist/history.js
          node --check dist/insights.js
          node --check dist/store.js
          node --check dist/metrics.js
          node --check dist/backup.js
          grep -q 'shell-v07' dist/sw.js
          grep -q 'v0.7' dist/index.html
          grep -q "'./history.js'" dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Publicar diário corporal v0.8 e executar regressões
        shell: bash
        run: |
          set -euo pipefail
          cat release-staging/v08/part01.b64 release-staging/v08/part02.b64 release-staging/v08/part03.b64 release-staging/v08/part04.b64 release-staging/v08/part05.b64 release-staging/v08/part06.b64 | base64 --decode > /tmp/treino-v08-upgrade.tar.xz
          echo "89300333d05778569e23d2e78c323743bac61889ce29bc2e05443401155084a8  /tmp/treino-v08-upgrade.tar.xz" | sha256sum --check
          mkdir -p /tmp/treino-v08-upgrade
          tar -xJf /tmp/treino-v08-upgrade.tar.xz -C /tmp/treino-v08-upgrade
          python3 /tmp/treino-v08-upgrade/apply_v08.py dist /tmp/treino-v08-upgrade
          mkdir -p dist/tests
          for testname in body_v08 history_v07 insights_v06; do
            sed 's@../public/@../@g' /tmp/treino-v08-upgrade/$testname.mjs > dist/tests/$testname.mjs
            node --experimental-default-type=module dist/tests/$testname.mjs | tee /tmp/treino-$testname.log
          done
          grep -qx 'TOTAL_BODY_TESTS=68' /tmp/treino-body_v08.log
          grep -qx 'TOTAL_HISTORY_TESTS=55' /tmp/treino-history_v07.log
          grep -qx 'TOTAL_INSIGHTS_TESTS=35' /tmp/treino-insights_v06.log
          rm -rf dist/tests
          for module in app store body history insights metrics backup edit_ops template_ops sw; do node --check dist/$module.js; done
          grep -q 'shell-v08' dist/sw.js
          grep -q "'./body.js'" dist/sw.js
          grep -q 'v0.8' dist/index.html
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Estabilizar backups e cache v0.9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          compressed=base64.b64decode(Path('release-staging/v09/qa-patch.xz.b64').read_text().strip(),validate=True)
          expected='7d8bbf6ea1c95bc0a9174ee6379293d5ea718c1b6ea611e5bc33727376c18ff6'
          assert hashlib.sha256(compressed).hexdigest()==expected, 'Hash SHA-256 da atualização v0.9 incompatível'
          delta=json.loads(lzma.decompress(compressed))
          assert delta['version']=='0.9.0'
          for name, change in delta['files'].items():
              p=Path('dist')/name
              previous=p.read_text(encoding='utf-8')
              assert hashlib.sha256(previous.encode()).hexdigest()==change['old_sha'], 'Base inesperada: '+name
              updated=previous
              for start,end,replacement in reversed(change['ops']):
                  updated=updated[:start]+replacement+updated[end:]
              assert hashlib.sha256(updated.encode()).hexdigest()==change['new_sha'], 'Arquivo alterado fora do esperado: '+name
              p.write_text(updated,encoding='utf-8')
          for name,content in delta['adds'].items():
              assert name in ('integrity.js',), 'Arquivo inesperado'
              assert hashlib.sha256(content.encode()).hexdigest()==delta['new_sha'][name]
              (Path('dist')/name).write_text(content,encoding='utf-8')
          print('V0.9 PATCH_HASH_OK; arquivo pessoal: NENHUM')
          PY
          for module in app store body history insights metrics backup edit_ops template_ops integrity sw; do node --check dist/$module.js; done
          grep -q 'shell-v09' dist/sw.js
          grep -q "'./integrity.js'" dist/sw.js
          grep -q 'v0.9' dist/index.html
          node --experimental-default-type=module --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {emptyDocument,commit} from './dist/store.js';
          import {encryptBackup} from './dist/backup.js';
          import {fingerprintDocument,verifyExportedBackup,inspectOfflineCache,OFFLINE_ASSETS,CACHE_NAME} from './dist/integrity.js';
          const doc=emptyDocument(),hash=await fingerprintDocument(doc);
          assert.equal(hash.length,64);
          assert.equal((await verifyExportedBackup(JSON.stringify(doc),'',{revision:0,fingerprint:hash})).valid,true);
          await assert.rejects(verifyExportedBackup(JSON.stringify(doc),'',{revision:1,fingerprint:hash}),/revisão/);
          await assert.rejects(verifyExportedBackup(JSON.stringify(commit(doc,d=>d.settings.weekly_goal=5)),'',{revision:0,fingerprint:hash}),/revisão/);
          const different=structuredClone(doc);different.settings.weekly_goal=5;
          await assert.rejects(verifyExportedBackup(JSON.stringify(different),'',{revision:0,fingerprint:hash}),/exatamente/);
          const encrypted=await encryptBackup(doc,'senha-publica-sintetica-longa');
          assert.equal((await verifyExportedBackup(JSON.stringify(encrypted),'senha-publica-sintetica-longa',{revision:0,fingerprint:hash})).valid,true);
          await assert.rejects(verifyExportedBackup(JSON.stringify(encrypted),'errada',{revision:0,fingerprint:hash}),/Senha incorreta/);
          const scope='https://example.github.io/treino-evolucao/';
          const present=new Set(OFFLINE_ASSETS.map(x=>new URL(x,scope).href));
          const caches={keys:async()=>[CACHE_NAME],open:async()=>({match:async url=>present.has(String(url))?{ok:true}:null})};
          assert.equal((await inspectOfflineCache(caches,scope)).complete,true);
          present.delete(new URL('./body.js',scope).href);
          assert.equal((await inspectOfflineCache(caches,scope)).complete,false);
          assert.equal((await inspectOfflineCache(null,scope)).complete,false);
          console.log('TOTAL_V09_CI_SMOKE=10');
          JS
          test ! -f dist/tests/qa_v09.mjs
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Integrar OAuth Google Sheets v1.0-beta e bloquear regressões
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v10-ui-part01.b64 patches/v10-ui-part02.b64 | base64 --decode > /tmp/v10-ui-patch.xz
          echo "06c7deb65d5df0e51acd4ea24f809a03de80a7bbd51a08bc4c235cda7aa2fcc8  /tmp/v10-ui-patch.xz" | sha256sum --check
          python3 - <<'PY'
          import json,lzma,hashlib
          from pathlib import Path
          patch=json.loads(lzma.decompress(Path('/tmp/v10-ui-patch.xz').read_bytes()))
          for name,entry in patch.items():
              if name not in ('app.js','index.html','integrity.js','sw.js'):
                  raise ValueError('Arquivo inesperado no patch: '+name)
              file=Path('dist')/name
              original=file.read_text(encoding='utf-8')
              assert hashlib.sha256(original.encode()).hexdigest()==entry['before'], 'Base incompatível: '+name
              updated=original
              for a,b,t in reversed(entry['ops']):
                  updated=updated[:a]+t+updated[b:]
              assert hashlib.sha256(updated.encode()).hexdigest()==entry['after'], 'Conteúdo incorreto: '+name
              file.write_text(updated,encoding='utf-8')
          print('V10_UI_PATCH=4_HASH_VERIFIED')
          PY
          for module in sheet_sync_core sheet_sync_browser sheets_config; do
            test -f integration/$module.js
            cp integration/$module.js dist/$module.js
          done
          mkdir -p /tmp/sheets-qa/public /tmp/sheets-qa/integration /tmp/sheets-qa/tests
          cp -R dist/. /tmp/sheets-qa/public/
          cp dist/sheet_sync_*.js /tmp/sheets-qa/integration/
          cp integration/tests/*.mjs /tmp/sheets-qa/tests/
          node --experimental-default-type=module /tmp/sheets-qa/tests/sheets_core.mjs | tee /tmp/sheets-core-results.log
          node --experimental-default-type=module /tmp/sheets-qa/tests/sheets_browser.mjs | tee /tmp/sheets-browser-results.log
          node --experimental-default-type=module /tmp/sheets-qa/tests/sheets_additional.mjs | tee /tmp/sheets-guard-results.log
          grep -qx 'SHEETS_SYNC_TESTS=13' /tmp/sheets-core-results.log
          grep -qx 'BROWSER_TRANSPORT_TESTS=10' /tmp/sheets-browser-results.log
          grep -qx 'TOTAL_SHEETS_GUARD_TESTS=11' /tmp/sheets-guard-results.log
          for mod in app store body history insights metrics backup edit_ops template_ops integrity sheet_sync_core sheet_sync_browser sheets_config sw; do
            node --check dist/$mod.js
          done
          grep -q 'shell-v10-sheets' dist/sw.js
          grep -q 'shell-v10-sheets' dist/integrity.js
          grep -q 'v1.0 beta Sheets' dist/index.html
          grep -q 'accounts.google.com' dist/index.html
          grep -q 'sheets.googleapis.com' dist/index.html
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/manifest.webmanifest
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
          echo 'TOTAL_SHEETS_TESTS=34; NO_PRIVATE_HISTORY=TRUE'
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato de publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
