name: Publicar Treino & Evolução
on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'patches/**'
      - 'tests/**'
      - 'release-staging/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código público
        uses: actions/checkout@v4
      - name: Restaurar a distribuição e validar integridade
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part01.b64 payload/part02.b64 payload/part03a.b64 payload/part03b.b64 payload/part04.b64 payload/part05.b64 payload/part06.b64 payload/part07.b64 | base64 --decode > /tmp/public-site.tar.xz
          echo "2a8836fc6cb58e9485d555149e3557cf676be3353630445f44052c32db444aee  /tmp/public-site.tar.xz" | sha256sum --check
          mkdir -p dist
          tar -xJf /tmp/public-site.tar.xz -C dist
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' | grep -q .
      - name: Aplicar atualização de edição e repetição de treinos (v0.4)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, lzma, json, hashlib
          from pathlib import Path
          raw=base64.b64decode(Path('patches/v04-update.xz.b64').read_text().strip(),validate=True)
          expected='11102740f955ab3964bb92e7860ba6891c5e259b1bfaf48f88190c37cc5de583'
          assert hashlib.sha256(raw).hexdigest()==expected, 'SHA-256 do pacote v0.4 diferente do esperado'
          delta=json.loads(lzma.decompress(raw))
          for name in ('app.js','sw.js','index.html'):
              entry=delta[name]; path=Path('dist')/name
              original=path.read_text(encoding='utf-8')
              assert hashlib.sha256(original.encode()).hexdigest()==entry['sha'], 'Versão base incompatível: '+name
              new=original
              for start,end,text in reversed(entry['ops']):
                  new=new[:start]+text+new[end:]
              path.write_text(new,encoding='utf-8')
          (Path('dist')/'edit_ops.js').write_text(delta['edit_ops.js'],encoding='utf-8')
          assert "shell-v4" in Path('dist/sw.js').read_text()
          assert "edit_ops.js" in Path('dist/sw.js').read_text()
          print('Upgrade v0.4 aplicado e conferido sem dados pessoais')
          PY
          node --check dist/app.js
          node --check dist/edit_ops.js
          test -f dist/icons/icon-192.png
          test -f dist/manifest.webmanifest
          ! find dist -iname '*historico*' -o -iname '*privado*' | grep -q .
      - name: Atualizar o app público para v0.5 e verificar integridade
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode patches/v05-public-site.tar.xz.b64 > /tmp/v05-public.tar.xz
          echo "9ff980ee805b230c2a62a88d8c7a06cf8f41a467dd8a4fe1235a724470c8f9ca  /tmp/v05-public.tar.xz" | sha256sum --check
          tar -xJf /tmp/v05-public.tar.xz -C dist
          test -f dist/template_ops.js
          grep -q "shell-v5" dist/sw.js
          grep -q "template_ops.js" dist/sw.js
          grep -q "Modelos" dist/index.html
          node --check dist/template_ops.js
          node --check dist/app.js
          node --check dist/store.js
          node --check dist/metrics.js
          node --check dist/backup.js
          node --check dist/edit_ops.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Aplicar correções auditadas v0.5.1 e executar regressões
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/v051_apply.py dist
          mkdir -p dist/tests
          cp tests/v051_regression.mjs dist/tests/regression.mjs
          node --experimental-default-type=module dist/tests/regression.mjs
          rm -rf dist/tests
          node --check dist/app.js
          node --check dist/store.js
          node --check dist/metrics.js
          node --check dist/edit_ops.js
          node --check dist/template_ops.js
          node --check dist/backup.js
          grep -q 'shell-v051' dist/sw.js
          grep -q 'v0.5.1' dist/index.html
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Atualizar análises v0.6 e testar evolução
        shell: bash
        run: |
          set -euo pipefail
          cat release-staging/v06/part01.b64 release-staging/v06/part02.b64 release-staging/v06/part03.b64 | base64 --decode > /tmp/treino-v06-upgrade.tar.xz
          echo "0b689ecd150057b4b1eb5efe8a9637ab7ac39099904f5268f083553ef4ec211c  /tmp/treino-v06-upgrade.tar.xz" | sha256sum --check
          mkdir -p /tmp/treino-v06-upgrade
          tar -xJf /tmp/treino-v06-upgrade.tar.xz -C /tmp/treino-v06-upgrade
          python3 /tmp/treino-v06-upgrade/apply_v06.py dist /tmp/treino-v06-upgrade
          mkdir -p dist/tests
          sed 's@../public/@../@g' /tmp/treino-v06-upgrade/tests/insights_v06.mjs > dist/tests/insights_v06.mjs
          node --experimental-default-type=module dist/tests/insights_v06.mjs | tee /tmp/treino-v06-tests.log
          grep -qx 'TOTAL_INSIGHTS_TESTS=35' /tmp/treino-v06-tests.log
          rm -rf dist/tests
          node --check dist/app.js
          node --check dist/insights.js
          node --check dist/sw.js
          grep -q 'shell-v06' dist/sw.js
          grep -q 'v0.6' dist/index.html
          grep -q "'./insights.js'" dist/sw.js
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato de publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
