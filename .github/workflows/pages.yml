name: Publicar Treino & Evolução
on:
  push:
    branches: [main]
    paths:
      - 'public-site.tar.xz'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extrair apenas os arquivos públicos
        run: |
          mkdir -p dist
          tar -xJf public-site.tar.xz -C dist
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar pacote Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
