          node --experimental-default-type=module integration/tests/coach_policy.mjs | tee /tmp/etapa5-coach-policy.log
          grep -qx 'ETAPA5_COACH_POLICY_TESTS=39' /tmp/etapa5-coach-policy.log
          node --experimental-default-type=module integration/tests/coach_substitution.mjs | tee /tmp/etapa5-substitution.log
          grep -qx 'ETAPA5_SUBSTITUTION_TESTS=26' /tmp/etapa5-substitution.log
          mkdir -p dist/tests
          cp /tmp/treino-coach-v104/tests/coach.mjs dist/tests/coach.mjs
          cp /tmp/coach-v105/coach_commands_release.mjs dist/tests/coach_commands.mjs
          node --experimental-default-type=module dist/tests/coach.mjs | tee /tmp/etapa5-old-coach.log
          grep -qx 'COACH_TESTS=25' /tmp/etapa5-old-coach.log
          node --experimental-default-type=module dist/tests/coach_commands.mjs | tee /tmp/etapa5-old-commands.log
          grep -qx 'COACH_COMMAND_TESTS=36' /tmp/etapa5-old-commands.log
          rm -rf dist/tests
          python3 - <<'PY'
          from pathlib import Path
          for name in ('sw.js','integrity.js'):
              p=Path('dist')/name
              data=p.read_text('utf8')
              assert 'shell-v110-automatic-safe' in data,name
              assert "'./coach_logic.js'" in data,name
              assert "'./coach_policy.js'" not in data,name
              data=data.replace("'./coach_logic.js'","'./coach_plan_read.js','./coach_substitution.js','./coach_policy.js','./coach_logic.js'")
              data=data.replace('shell-v110-automatic-safe','shell-v112-coach-plan-sync')
              p.write_text(data,'utf8')
          p=Path('dist/index.html')
          html=p.read_text('utf8')
          assert 'v1.1.0 beta Sincronização' in html
          p.write_text(html.replace('v1.1.0 beta Sincronização','v1.1.2 beta Assistente Plano'),'utf8')
          PY
          node --check dist/sw.js
          node --check dist/integrity.js
          grep -q 'shell-v112-coach-plan-sync' dist/sw.js
          grep -q 'shell-v112-coach-plan-sync' dist/integrity.js
          grep -q "'./coach_policy.js'" dist/sw.js
          grep -q "'./coach_policy.js'" dist/integrity.js
          grep -q "'./coach_substitution.js'" dist/sw.js
          grep -q "'./coach_plan_read.js'" dist/sw.js
          grep -q 'v1.1.2 beta Assistente Plano' dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
          echo 'ETAPA5=PASS; PLAN_ONLY_LOCAL=TRUE; USER_SHEET_UNMODIFIED=TRUE'
      - name: Etapa 6 — homologação E2E do assistente e dados
        shell: bash
        run: |
          set -euo pipefail
          node --check quality/stage6_end_to_end.mjs
          node --experimental-default-type=module quality/stage6_end_to_end.mjs | tee /tmp/stage6-e2e.log
          grep -qx 'STAGE6_E2E_TESTS=56' /tmp/stage6-e2e.log
          node --experimental-default-type=module integration/tests/legacy_identity.mjs | tee /tmp/stage6-dedup.log
          grep -qx 'ETAPA1_DEDUP_TESTS=36' /tmp/stage6-dedup.log
          node --experimental-default-type=module integration/tests/remote_reconcile.mjs | tee /tmp/stage6-conflict.log
          grep -qx 'ETAPA2_RECONCILIATION_TESTS=53' /tmp/stage6-conflict.log
          node --experimental-default-type=module integration/tests/write_receipt_recovery.mjs | tee /tmp/stage6-write.log
          grep -qx 'ETAPA3_WRITE_TESTS=41' /tmp/stage6-write.log
          node --experimental-default-type=module integration/tests/automatic_sync.mjs | tee /tmp/stage6-auto.log
          grep -qx 'ETAPA4_AUTO_POLICY_TESTS=35' /tmp/stage6-auto.log
          node --experimental-default-type=module integration/tests/coach_plan_read.mjs | tee /tmp/stage6-plan.log
          grep -qx 'ETAPA5_PLAN_READ_TESTS=16' /tmp/stage6-plan.log
          node --experimental-default-type=module integration/tests/coach_substitution.mjs | tee /tmp/stage6-substitution.log
          grep -qx 'ETAPA5_SUBSTITUTION_TESTS=26' /tmp/stage6-substitution.log
          python3 - <<'PY'
          from pathlib import Path
          required=('app.js','store.js','backup.js','coach_logic.js','coach_commands.js','coach_policy.js','coach_substitution.js','coach_plan_read.js','sheet_sync_core.js','sheet_sync_browser.js','automatic_sync.js','write_receipt.js','sw.js','integrity.js','index.html','manifest.webmanifest')
          for name in required:
              assert (Path('dist')/name).is_file(),name
          app=Path('dist/app.js').read_text('utf8')
          assert 'fetchCoachPlanRows' in app
          assert "coach_plan_rules" in app
          assert "automaticSheets.request('save')" in app
          assert 'replaceCoachVariant' in app
          for file in ('sw.js','integrity.js'):
              data=(Path('dist')/file).read_text('utf8')
              for name in ('coach_plan_read.js','coach_policy.js','coach_substitution.js','automatic_sync.js','sheet_sync_browser.js'):
                  assert f"'./{name}'" in data,(file,name)
          assert 'v1.1.2 beta Assistente Plano' in Path('dist/index.html').read_text('utf8')
          print('STAGE6_OFFLINE_BUILD=PASS')
          PY
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
          echo 'ETAPA6_AUTOMATED_QA=PASS; NO_REAL_USER_DATA=TRUE; NO_ANDROID_HARDWARE_ATTESTATION=TRUE'
