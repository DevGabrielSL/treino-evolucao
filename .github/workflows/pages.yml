name: Publicar Treino & Evolução
on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'patches/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código público
        uses: actions/checkout@v4
      - name: Restaurar a distribuição e validar integridade
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part01.b64 payload/part02.b64 payload/part03a.b64 payload/part03b.b64 payload/part04.b64 payload/part05.b64 payload/part06.b64 payload/part07.b64 | base64 --decode > /tmp/public-site.tar.xz
          echo "2a8836fc6cb58e9485d555149e3557cf676be3353630445f44052c32db444aee  /tmp/public-site.tar.xz" | sha256sum --check
          mkdir -p dist
          tar -xJf /tmp/public-site.tar.xz -C dist
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' | grep -q .
      - name: Atualizar o app público para v0.5 e verificar integridade
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode patches/v05-public-site.tar.xz.b64 > /tmp/v05-public.tar.xz
          echo "9ff980ee805b230c2a62a88d8c7a06cf8f41a467dd8a4fe1235a724470c8f9ca  /tmp/v05-public.tar.xz" | sha256sum --check
          tar -xJf /tmp/v05-public.tar.xz -C dist
          test -f dist/template_ops.js
          grep -q "shell-v5" dist/sw.js
          grep -q "template_ops.js" dist/sw.js
          grep -q "Modelos" dist/index.html
          node --check dist/template_ops.js
          node --check dist/app.js
          node --check dist/store.js
          node --check dist/metrics.js
          node --check dist/backup.js
          node --check dist/edit_ops.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato de publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
