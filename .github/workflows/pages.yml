name: Publicar Treino & Evolução
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'integration/tests/**'
      - 'quality/**'
      - 'testing/**'
      - 'production/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Regressões da lógica (armazenamento, backup, Sheets, assistente)
        run: node legacy-tests/run.mjs
      - name: Testes da camada de jogo (temporadas e mapa)
        run: node game-tests/run.mjs
      - name: Montar o app e o modo offline
        env:
          VITE_RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html && test -f dist/sw.js && test -f dist/manifest.webmanifest && test -f dist/icons/icon-mission-192.png
          grep -q 'treino-evolucao-android-shell-react-' dist/sw.js
          grep -q 'Content-Security-Policy' dist/index.html
          ! find dist -type f \( -iname '*historico*' -o -iname '*estado_operacional*' -o -iname '*privado*' \) | grep -q .
          ! grep -rq 'session_demo' dist
      - name: Testes de ponta a ponta no navegador (treino, dados, offline, atualização)
        run: |
          set -euo pipefail
          npm run build:e2e-b
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" CI=1 npx playwright test
      - name: Guardar evidências se os testes falharem
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: app/test-results
          retention-days: 7
      - name: Incluir página de diagnóstico de conexão
        run: cp ../testing/diagnostico_conexao.html ../testing/diagnostico_conexao.js dist/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Enviar artefato de publicação
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v5
